<title>Лавка зелий</title>
<!-- заготовка от учителя: страница вокруг скрипта. Скрипт ниже написал ученик (A1, задача по пройденному). -->
<script>
const heroHpMax=110
let gold = 100
let heroHp=40
const pricePotion=30
const potionHeal=25
let potionDrink=0
gold-=(pricePotion)
heroHp+=potionHeal
potionDrink++
console.log(`Здоровье: ${heroHp} из: ${heroHpMax}`)
console.log(`Золото: ${gold}`)
console.log(`Выпито зелий: ${potionDrink}`)
</script>
