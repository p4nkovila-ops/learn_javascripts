<title>Лучник</title>
<!-- заготовка от учителя: страница вокруг скрипта. Скрипт и комментарии ниже написал ученик (A1, задание «Лучник», последняя рабочая версия). -->
<script>
let heroGold = "75" //деньги героя преобразовать в число 
const heroGoldMax = 120 // максимум денег в кошельке 
let quiverArrows = 4 // стрелы в колчане героя 
const quiverArrowsMax=20 // максимум стрел в колчане
const packArrows = 10 //  стрел в пачке
const packPrice = 30 // цена одной пачки

heroGold=Number (heroGold) // преобразование денего из тексат в число

let enemyHp=50 // хп врага 
const ArrowDamage=12// урон от одной стрелы 

let packBuy=2 // куплено пачек стрел
let shot = 3 // выстрелов сделано 
// показать: золото:... Стрелы:... из ... Здоровье врага: 

quiverArrows += packBuy*packArrows-shot
heroGold-=packPrice*2
enemyHp-=shot*ArrowDamage
quiverArrows=Math.min(quiverArrows, quiverArrowsMax)

console.log (`Золото: ${heroGold} из: ${heroGoldMax}`)
console.log (`Стрелы: ${quiverArrows} из: ${quiverArrowsMax}`)
console.log (`Здоровье врага: ${enemyHp}`)
</script>
