<!doctype html>
<meta charset="utf-8">
<title>Бомбы</title>
<!-- заготовка от учителя: страница вокруг скрипта. Скрипт и комментарии ниже написал ученик (A1, задача «Бомбы», с айфона, итоговая версия). -->
<script>
let heroGold="60"; //денег в сумке (текст)
heroGold=Number(heroGold); 

let bagBombs=1; // бомб в сумке в текущий момент
const bagBombsMax=4; // максимум бомб в сумке 

let bombBuy=2; // купили бомб 
const bombPrice=25; // цена бомбы 

const bombDamage=35; // урон бомбы 
let bombAttack=1; //атака бомбой
let enemyHp=80;//ХП врага

bagBombs+=bombBuy;
bagBombs=Math.min(bagBombs, bagBombsMax);
bagBombs-=bombAttack;

heroGold-=bombPrice*bombBuy;

enemyHp-=bombDamage;

let loot=23;
let party=5;
let heroLoot=0;
heroLoot=loot%party;
heroGold+=(heroLoot);
// Золото: 13// 
// Бомбы: 2 из 4// 
// Здоровье врага: 45// 
// Добыча герою: 3
console.log (`Золото:${heroGold}`);
console.log (`Бомбы:${bagBombs} из${bagBombsMax}`);
console.log (`Здоровье врага: ${enemyHp}`);
console.log (`Добыча героя ${heroLoot}`);
</script>
